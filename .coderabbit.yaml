# CodeRabbit configuration — https://docs.coderabbit.ai/reference/configuration
language: zh-CN

reviews:
  profile: chill            # 宽松档：只报值得说的问题（assertive 为严格档）
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false

chat:
  auto_reply: true
