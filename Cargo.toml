[workspace]
resolver = "2"
members = [
    "crates/oxcost",
    "crates/oxcost-contract",
    "crates/oxcost-core",
    "crates/oxcost-protocol",
    "crates/oxcost-sdk",
    "plugins-in-process/tokenharbor",
    "plugins-in-process/mimo-rust",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "AGPL-3.0"

[workspace.dependencies]
oxcost-contract = { path = "crates/oxcost-contract" }
oxcost-core = { path = "crates/oxcost-core" }
oxcost-protocol = { path = "crates/oxcost-protocol" }
oxcost-sdk = { path = "crates/oxcost-sdk" }

axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
