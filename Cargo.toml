[workspace]
resolver = "2"
members = [
    "crates/oxcost",
    "crates/oxcost-contract",
    "crates/oxcost-core",
    "crates/oxcost-protocol",
    "crates/oxcost-sdk",
    "plugins-in-process/tokenharbor",
    "plugins-in-process/mimo-rust",
    "plugins-in-process/simple-chat",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "AGPL-3.0"
# Local deployment only (never published to crates.io). Also marks
# members private for cargo-deny's wildcard lint: internal path deps
# carry no version req.
publish = false

[workspace.dependencies]
oxcost-contract = { path = "crates/oxcost-contract" }
oxcost-core = { path = "crates/oxcost-core" }
oxcost-protocol = { path = "crates/oxcost-protocol" }
oxcost-sdk = { path = "crates/oxcost-sdk" }
oxcost-plugin-simple-chat = { path = "plugins-in-process/simple-chat" }

axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
