[package]
name = "oxcost"
description = "OxCost host binary: CLI, manifest loading, axum assembly"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
oxcost-contract = { workspace = true }
oxcost-core = { workspace = true }
oxcost-sdk = { workspace = true }
oxcost-plugin-tokenharbor = { path = "../../plugins-in-process/tokenharbor" }
mimo-rust = { path = "../../plugins-in-process/mimo-rust" }
axum = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
futures-util = "0.3.34"
serde_json.workspace = true

[dev-dependencies]
assert_cmd = "2"
http-body-util = "0.1"
predicates = "3"
tower = { version = "0.5", features = ["util"] }
