# Example remote-mode plugin manifest (synthetic upstream, no secrets).
# Used by M1 integration tests as a valid fixture.

manifestVersion = "0.1"
id = "dev.oxcost.example-remote"
name = "example-remote"
version = "0.1.0"
apiVersion = "v1"
license = "MIT"

[entry]
mode = "remote"
url = "https://relay.example.com/v1"

[routing]
enabled = true
models = [
  "example-remote/example-chat",
  "example-remote/example-flash",
]
unknown_model = "pass"

[capabilities]
chat = true
web_search = true

[auth]
keys = "env:EXAMPLE_REMOTE_API_KEYS"

[source]
repository = "https://example.invalid/example-remote"
