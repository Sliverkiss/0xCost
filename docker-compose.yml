# mimo2api compose (SDD §6): port 8080, /data volume for accounts.json,
# in-binary healthcheck (distroless has no curl/wget).
#
# ONE container, ONE published port (ADR 0016, superseding the tool layer of
# ADR 0012): host 21223 → the gateway itself.
#
#   client :21223 --(Bearer $MIMO2API_API_KEYS)--> mimo2api:8080
#
# The tool layer is gone: MiMo has no native function calling, the middleware
# serving it injected a protocol prompt that spent 1,355–5,222 characters of the
# query budget (ADR 0015) — context the platform's 102,400-character ceiling does
# not have to spare — and an OpenAI client that wants tools can call them itself
# now that one hop and its prompt are out of the path. A request that still
# carries `tools` is answered normally with the tools reported as dropped
# (`X-Mimo-Warnings`), never silently.
services:
  mimo2api:
    build: .
    image: mimo2api
    container_name: mimo2api
    ports:
      # The deployment's only published port, on the LOOPBACK ONLY (ADR 0016):
      # TLS and the public hostname belong to the reverse proxy in front (Caddy
      # terminates :443 and proxies to 127.0.0.1:21223), and every other service
      # on this host binds 127.0.0.1 too — an exposed API port is an exposed key.
      - "127.0.0.1:21223:8080"
    volumes:
      - ./data:/data # accounts.json + runtime state (SDD §4.7)
    environment:
      - MIMO2API_ACCOUNTS_FILE=/data/accounts.json
      # The one key, shared by both hops: the middleware accepts it, then passes
      # the caller's own header through, and this line is what authorises it here.
      - MIMO2API_API_KEYS=${MIMO2API_API_KEYS:-}
      - MIMO2API_DEFAULT_MODEL=${MIMO2API_DEFAULT_MODEL:-mimo-v2.6-pro}
      - MIMO2API_LOG_LEVEL=${MIMO2API_LOG_LEVEL:-info}
      # Pinned policy, not left to a default that could drift:
      #   a revoked credential heals in the background (ADR 0014) instead of
      #   stopping the deployment, and starting a re-login must never spend an
      #   SMS on its own — the operator finishes a human gate (ADR 0013).
      - MIMO2API_SESSION_REFRESH_HOURS=${MIMO2API_SESSION_REFRESH_HOURS:-12}
      - MIMO2API_OTP_AUTO=${MIMO2API_OTP_AUTO:-false}
      # 0 = per-channel caps (50k fastchat / 90k others); a positive value is the
      # operator override for a client that sends more context than the Studio's
      # own UI would (MIMO2API_MAX_QUERY_CHARS, ADR 0015).
      - MIMO2API_MAX_QUERY_CHARS=${MIMO2API_MAX_QUERY_CHARS:-0}
      # Chat is non-streaming on this deployment (ADR 0016): a request asking for
      # stream:true is refused with a clear 400 instead of being silently served
      # as one blob (never a silent downgrade). Flip to true only for a client
      # that genuinely needs SSE.
      - MIMO2API_ALLOW_STREAM=${MIMO2API_ALLOW_STREAM:-false}
    healthcheck:
      test: ["CMD", "/mimo2api", "healthcheck"] # GET /healthz, exit 0/1
      interval: 30s
      timeout: 5s
      retries: 3
      # Generous on purpose: a cold start (module-less distroless image, live
      # catalog warm-up that talks to the upstream) can take longer than the first
      # probe window, and a short start_period makes a first `up` report an
      # unhealthy container while the gateway is in fact still coming up.
      start_period: 30s
    restart: unless-stopped
