name: Claude Ops

# 运维辅助双任务（模式来自官方 Solutions Guide）：
# ① triage  — 新 issue 自动分类打标签 + 必要时追问
# ② patrol  — 每周一 11:00 (CST) 自动巡检仓库健康，也可手动 dispatch
# 门禁与 key 同 claude.yml：全走 Secrets，仅 Sliverkiss 触发

on:
  issues:
    types: [opened]
  schedule:
    - cron: '0 3 * * 1' # 周一 03:00 UTC = 11:00 北京时间
  workflow_dispatch: {}

env:
  ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
  ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_API_KEY }}
  ANTHROPIC_MODEL: GLM-5.3-Flash
  ANTHROPIC_SMALL_FAST_MODEL: GLM-5.3-Flash
  ANTHROPIC_DEFAULT_OPUS_MODEL: GLM-5.3-Flash
  ANTHROPIC_DEFAULT_SONNET_MODEL: GLM-5.3-Flash
  ANTHROPIC_DEFAULT_HAIKU_MODEL: GLM-5.3-Flash
  API_TIMEOUT_MS: '600000'

jobs:
  triage:
    if: github.event_name == 'issues' && github.event.sender.login == 'Sliverkiss'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 1 }
      - name: 自动分类打标
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: #${{ github.event.issue.number }}

            请为这个 issue 分类并打标签（用中文思考，标签用英文）：
            1. 判断类型并从现有标签中选择打上：bug（缺陷）、enhancement（新功能）、documentation（文档）、question（咨询）
            2. 若描述太含糊、无法执行，用 gh issue comment 追问具体化问题，不要自己脑补
            3. 若描述已足够具体，额外加一句评论说明你判断的类型和理由（一两句即可）
            注意：只打标签和评论，不要改代码、不要开 PR、不要关闭 issue。
          claude_args: |
            --allowedTools "Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh issue view:*)"

  patrol:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.actor == 'Sliverkiss')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: 每周巡检
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}

            对本仓库（OxCost，AI 网关聚合框架，Go 技术栈规划中）做例行巡检：
            1. 仓库健康：README/LICENSE/.coderabbit.yaml 是否齐全一致，workflows 最近是否有失败 run
            2. 若已有 Go 代码：检查过期依赖与 go build ./... ./go test ./... 是否通过
            3. 过滤开放 issues：标记长期无进展（>30 天无活动）的，评论催办或建议关闭
            4. 发现小问题（文档错误、笔误）→ 直接开修复 PR；需要决策的大问题 → 开 issue 说明
            5. 一切正常 → 不要开任何 PR/issue
            6. 最后把本次巡检结果汇总成周报：用 gh 查找标题为「📋 巡检周报」的开放 issue
               （gh issue list --search "巡检周报 in:title"）；不存在则用
               gh issue create 新建（标题：📋 巡检周报，正文注明每周自动更新），
               然后在该 issue 下评论本次报告（日期、检查项、结论、处理动作；无事则写「巡检通过」+ 检查清单）
            禁止：修改 .github/workflows/**、.coderabbit.yaml、LICENSE；直接 push main；合并任何 PR。
          claude_args: |
            --allowedTools "Read,Write,Edit,Bash(gh issue:*),Bash(gh pr:*),Bash(gh run:*),Bash(go:*),Bash(git:*)"
